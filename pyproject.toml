[project]
name = "cardgame"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "simple-websocket>=1.0",
]
# Rust-backed solver core (cardgame.solve_native); building it needs a
# Rust toolchain + C linker. Everything falls back to the pure-Python
# solver without it.
native = [
    "cardgame-native",
]

[tool.uv.sources]
cardgame-native = { path = "native" }

[project.scripts]
cardgame = "cardgame:main"
cardgame-web = "cardgame.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
