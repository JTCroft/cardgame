[project]
name = "cardgame"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "simple-websocket>=1.0",
]

[project.scripts]
cardgame = "cardgame:main"
cardgame-web = "cardgame.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
